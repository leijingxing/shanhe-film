name: Animated film acceptance
on:
  push:
    paths:
      - 'preview-v2/**'
      - 'index.html'
      - 'style.css'
      - 'film.js'
      - 'world.js'
      - 'timeline.js'
      - 'score.js'
      - 'vendor/**'
      - 'assets/**'
      - '.github/workflows/film-acceptance.yml'
      - 'tests/browser-acceptance.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official browser test dependencies
        run: |
          npm install --no-save --ignore-scripts playwright@1.55.1
          npx playwright install --with-deps chromium
      - name: Run complete film and interaction acceptance
        run: |
          python3 -m http.server 8000 > /tmp/film-server.log 2>&1 &
          if [ -f package.json ]; then npm test; fi
          if grep -q 'A LIVING LANDSCAPE' index.html; then export FILM_URL=http://127.0.0.1:8000/; fi
          node tests/browser-acceptance.mjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanhe-browser-frames
          path: |
            qa-browser/*.jpg
            qa-browser/result.json
          retention-days: 7
      - name: Preserve full playback video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shanhe-browser-video
          path: qa-browser/video/
          retention-days: 7
